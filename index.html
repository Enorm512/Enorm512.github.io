<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Normann Games</title>
<style>
 :root{--bg:#05070f;--fg:#dfe6f2;--dim:#8b9ab5;--cyan:#38d9f0}
 body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
   font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
   display:flex;align-items:center;justify-content:center;padding:2rem}
 .wrap{max-width:34rem;text-align:center}
 h1{font-size:2.6rem;letter-spacing:.34em;margin:0 0 .2rem;font-weight:800}
 .tag{color:var(--dim);letter-spacing:.22em;font-size:.78rem;margin-bottom:3rem}
 h2{font-size:1.35rem;letter-spacing:.16em;margin:0 0 .5rem}
 p{color:var(--dim);margin:0 0 1.6rem}
 a{color:var(--cyan);text-decoration:none;border-bottom:1px solid #38d9f055}
 .rule{height:1px;background:linear-gradient(90deg,transparent,#38d9f044,transparent);margin:2.6rem 0}
 footer{color:#5d6b85;font-size:.8rem}
</style></head><body>
<div class="wrap">
  <h1>POLARITY</h1>
  <div class="tag">ONE TAP. FLIP GRAVITY.</div>
  <h2>A one-thumb arcade game</h2>
  <p>Tap to flip gravity. Thread the neon tunnel. Four stages, ten hand-built
     obstacle patterns, and a soundtrack the obstacles arrive in time with.</p>
  <p><a href="privacy-policy.html">Privacy policy</a></p>
  <div class="rule"></div>
  <footer>Normann Games &middot; Verdal, Norway</footer>
</div>
</body></html>
